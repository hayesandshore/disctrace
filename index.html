<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DiscTrace bench</title>
  <meta name="description" content="Connect to a DGT-1 disc pod, capture a throw, and read the spin and acceleration data.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2312211b'/%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%23f2c230' stroke-width='3'/%3E%3Ccircle cx='21' cy='20' r='2.5' fill='%23f2c230'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>DiscTrace bench</h1>
    <p class="link-line"><span id="link-text">Not connected</span>
      <button type="button" id="link-disconnect" class="text-button" hidden>Disconnect</button></p>
  </header>

  <div class="layout">
    <div class="rail">
      <section class="pod" id="pod" aria-label="Pod"></section>
      <p id="pod-status" class="sr-only" role="status"></p>

      <section class="tools" aria-label="Pod tools">
        <details id="tools-details">
          <summary>Pod tools</summary>
          <div id="tools-body"></div>
        </details>
        <details id="log-details">
          <summary>Bluetooth log</summary>
          <ol id="log" class="log"></ol>
          <button type="button" id="log-copy" class="quiet">Copy log</button>
        </details>
      </section>

      <section class="history" aria-labelledby="history-title">
        <h2 id="history-title">Saved throws</h2>
        <p id="history-note" class="note" hidden></p>
        <ul id="history-list" class="history-list"></ul>
        <details id="import-details">
          <summary>Import a capture</summary>
          <p class="note">Choose a saved CSV, or paste terminal output that contains a DUMP.</p>
          <input type="file" id="import-file" accept=".csv,.txt,text/plain,text/csv">
          <textarea id="import-text" rows="4" aria-label="Pasted capture text"
            placeholder="t_ms,ax_g,ay_g,az_g,…"></textarea>
          <button type="button" id="import-go" class="quiet">Import pasted text</button>
          <p id="import-error" class="problem" hidden></p>
        </details>
      </section>
    </div>

    <main id="throw" class="throw" tabindex="-1"></main>

    <aside class="console" id="console" aria-label="Diagnostics console">
      <h2>Diagnostics console</h2>
      <p class="console-status" id="console-status">Starting.</p>
      <div class="console-tools">
        <button type="button" id="console-checks" class="quiet">Run checks</button>
        <button type="button" id="console-scan" class="quiet">Scan for all Bluetooth devices</button>
        <button type="button" id="console-copy" class="quiet">Copy all</button>
        <button type="button" id="console-save" class="quiet">Download log</button>
        <button type="button" id="console-clear" class="quiet">Clear</button>
        <label class="console-raw"><input type="checkbox" id="console-raw" checked> Show every Bluetooth packet</label>
      </div>
      <div id="console-log" class="console-log" role="log" aria-live="off" tabindex="0"></div>
      <form id="console-form" class="console-form">
        <input id="console-input" type="text" autocomplete="off" spellcheck="false"
          aria-label="Command to send to the pod" placeholder="Type STATUS, INFO, ARM or CANCEL, then Enter">
        <button type="submit" class="quiet">Send</button>
      </form>
    </aside>
  </div>

  <noscript>This page needs JavaScript to talk to the pod.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
